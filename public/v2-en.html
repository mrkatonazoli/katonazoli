    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

    // "page text" from it, minting attacker HTML as an artifact-origin

    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);

      delete pendingRelays[uuid];

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        UUID_SHAPE.test(d.__bundler_page) &&

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

s.src = (window.__resources && window.__resources.portraitJs) || './portrait.js';\n    s.onload = () => { if (this.imgRef.current && window.PORTRAIT) this.imgRef.current.src = window.PORTRAIT; };\n    document.head.appendChild(s);\n    this._rs = () => this.setState({ narrow: window.innerWidth < 760, w: window.innerWidth });\n    this._rs();\n    window.addEventListener('resize', this._rs);\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this._rs); }\n\n  T = {\n    hu: {\n      role: 'Hotel Tech & Guest Journey Specialist',\n      tag_a: '', tag_hl: 'Vendégutakat', tag_b: 'tervezek: digitális marketing, szoftver, integrációk — és a mögöttük lévő működés.',\n      cta: 'Beszéljünk', country: 'Magyarország', founder: 'alapító',\n      l_thesis: 'tézis',\n      thesis_a: 'A szállodák nem azért veszítenek foglalást, mert nincs szoftverük. Hanem mert nincs, aki',\n      thesis_hl: 'működtesse.',\n      thesis_1: 'A legtöbb szállodában ma már nincs dedikált revenue manager és nincs marketinges — és a munkaerőpiac alapján nem is lesz. Közben elvárás öt-tíz különálló rendszer üzemeltetése ahhoz, hogy megteljenek a szobák.',\n      thesis_2: 'Ezért a vendégszerzés munkaerő-problémává válik, és ki fog szerveződni — ahogy korábban a könyvelés vagy az IT. Nem az nyer, akinek a legjobb szoftvere van, hanem akinek van, aki működteti.',\n      l_order: 'a sorrend',\n      order_h: 'Szolgáltatásból nőtt termék.',\n      order_p: 'A Hotel Tech piacon a jellemző út fordított. Nálunk a termék a működésből következett — ezért tudjuk, mit kell tudnia.',\n      them_h: 'A piac így csinálja', w_product: 'Termék', w_market: 'Piacra dobás', w_maybe: 'Érti-e a szállodát?',\n      them_p: 'Előbb épül a szoftver, és utólag derül ki, érti-e az építője a szállodák valódi működését.',\n      us_h: 'A MORGENS így csinálta', w_service: 'Szolgáltatás', w_need: 'Valós igény',\n      us_p: 'Előbb a napi vendégszerzést végeztük, valós ügyfeleknek. Ebből nőtt ki a RoomSome booking engine, majd a Loyalty — és ebből építünk teljes technológiai ökoszisztémát.',\n      morgens_h: 'Nem eszközt szállítunk. Elvégezzük a munkát.',\n      morgens_p: 'Szállodák vendégszerzését üzemeltető csapat. Minden, ami a vendéget megszerzi és meg is tartja — egyetlen szerződésben, a szálloda bevételi céljához igazítva.',\n      morgens_foot: 'A szoftver adja a hozzáférést és a skálázhatóságot; a service réteg azt a szakértelmet, ami a vendéget ténylegesen megszerzi — megfelelő költségen és megfelelő minőségben.',\n      rs_h: 'A technológia mögötte.', rs_lead_a: 'Egy rendszer tíz helyett', rs_lead_b: '— hogy a vendégút ne szakadjon meg a szoftverek között.',\n      rs_p: 'A MORGENS mögötti technológiai ökoszisztéma. A magja a booking engine, köré épülnek a vendégút szakaszait kiszolgáló modulok. Szándékosan PMS-független: nem váltja ki a szálloda meglévő rendszerét, hanem mellette működik.',\n      rs_core: 'a mag',\n      rs_note: 'a szaggatott elemek fejlesztés alatt',\n      l_loop: 'a hurok', loop_h: 'Miért erősödik minden foglalással?',\n      loop_return: 'visszatérő vendég — alacsonyabb akvizíciós költség',\n      mentio_h: 'AI-láthatóság szállodáknak.',\n      mentio_1: 'A vendégek ma már a ChatGPT-t, a Geminit és a Google AI-t is megkérdezik, hol szálljanak meg — a legtöbb szálloda viszont láthatatlan ezekben a válaszokban.',\n      mentio_2: 'A Mentio megmutatja, mennyire ajánlják a szállodát a mesterséges intelligencia szálláshely-ajánlásaiban — magyar, angol és német nyelven —, és hol lehet előrébb lépni.',\n      l_topics: 'miről beszélek', topics_h: 'Amiről hitelesen.',\n      quote_a: 'Egy rendszer tíz helyett',\n      quote_b: '— hogy a vendégszerzési folyamatok és vendégút ne szakadjon meg a szoftverek és a csapatok között.',\n      contact_h: 'Beszéljünk!',\n      contact_p: 'Elrontott értékesítési tölcsér, elavult foglalási folyamat, vagy egy „a szállodák ezt így csinálják” érv? Írj — újra akarom építeni jobban.',\n      idle: 'Vidd egy fázis fölé, mit csinálok ott.',\n      soon: 'hamarosan'\n    },\n    en: {\n      role: 'Hotel Tech & Guest Journey Specialist',\n      tag_a: 'I architect', tag_hl: 'guest journeys', tag_b: 'through digital marketing, software, integrations, and the ops behind them.',\n      cta: 'Get in touch', country: 'Hungary', founder: 'founder',\n      l_thesis: 'thesis',\n      thesis_a: \"Hotels don't lose bookings because they lack software. They lose them because there's no one left to\",\n      thesis_hl: 'run it.',\n      thesis_1: \"Most properties no longer have a revenue manager or a marketing lead — and the labour market says they won't get them back. Meanwhile they're expected to operate five to ten disconnected systems just to fill their rooms.\",\n      thesis_2: \"So guest acquisition becomes a staffing problem, and it will get outsourced — the way accounting and IT did before it. The winner isn't whoever has the best software; it's whoever has someone to run it.\",\n      l_order: 'the ordering',\n      order_h: 'A product grown from service.',\n      order_p: 'In hotel tech the usual path is the reverse. Here the product followed the operation — which is why we know what it has to do.',\n      them_h: 'How the market does it', w_product: 'Product', w_market: 'Launch', w_maybe: 'Does it get hotels?',\n      them_p: 'The software is built first, and only later does it show whether the builder understands how hotels actually work.',\n      us_h: 'How MORGENS did it', w_service: 'Service', w_need: 'Real need',\n      us_p: 'First we did the daily guest acquisition, for real clients. The RoomSome booking engine grew out of that, then Loyalty — and from it we are building a full technology ecosystem.',\n      morgens_h: \"We don't supply tools. We do the work.\",\n      morgens_p: \"A team that operates hotel guest acquisition. Everything that brings the guest in — and keeps them — under one contract, aligned to the hotel's revenue goal.\",\n      morgens_foot: 'The software provides access and scale; the service layer provides the expertise that actually brings guests in — at the right cost, and at the right quality.',\n      rs_h: 'The technology underneath.', rs_lead_a: 'One system instead of ten', rs_lead_b: '— so the guest journey stops breaking between tools.',\n      rs_p: \"The technology ecosystem behind MORGENS. A booking engine at its core, with modules serving each stage of the guest journey built around it. Deliberately PMS-independent: it works alongside the hotel's existing system rather than replacing it.\",\n      rs_core: 'the core',\n      rs_note: 'dashed items are in development',\n      l_loop: 'the loop', loop_h: 'Why it compounds with every booking?',\n      loop_return: 'returning guest — lower acquisition cost',\n      mentio_h: 'AI visibility for hotels.',\n      mentio_1: \"Guests increasingly ask ChatGPT, Gemini and Google's AI where to stay — yet most hotels are invisible in those answers.\",\n      mentio_2: 'Mentio shows how often a hotel gets recommended in AI accommodation results — in Hungarian, English and German — and where it can move up.',\n      l_topics: 'what i speak to', topics_h: 'Credibly, on:',\n      quote_a: 'One system instead of ten',\n      quote_b: '— so the guest-acquisition process and the guest journey never break between tools and teams.',\n      contact_h: \"Let's talk.\",\n      contact_p: \"A broken funnel, an outdated booking flow, or a “that's just how hotels do it”? Write — I'll want to rebuild it better.\",\n      idle: 'Hover a phase for what I do there.',\n      soon: 'soon'\n    }\n  };\n\n  PHASES = {\n    hu: [['Felfedezés','marketing','Direkt foglalás optimalizálás, OTA-stratégia, attribúció, keresési láthatóság.'],\n         ['Foglalás','rezerváció','Booking engine, fizetési folyamatok, konverziós design, channel manager.'],\n         ['Érkezés előtt','ráhangolódás','Visszaigazolás, upsell, elvárás-hangolás, preferenciák rögzítése.'],\n         ['Megérkezés','check-in','Mobil kulcs, kioszk, digitális azonosítás, súrlódásmentes első benyomás.'],\n         ['Tartózkodás','szolgáltatás','Szobai tech, vendégüzenetek, helyszíni appok, valós idejű kérések.'],\n         ['Elutazás','checkout','Számlazárás, mobil checkout, késői kijelentkezés ajánlatok.'],\n         ['Visszatérés','loyalty','Távozás utáni visszajelzés, loyalty, szegmentálás, win-back kampányok.']],\n    en: [['Discover','search & intent','Direct-booking optimization, OTA strategy, attribution & search visibility.'],\n         ['Book','reservation','Booking engines, payment flows, conversion design, channel managers.'],\n         ['Pre-arrival','anticipation','Confirmation flows, upsell, expectation setting, preference capture.'],\n         ['Arrive','check-in','Mobile keys, kiosks, digital ID, a frictionless first impression.'],\n         ['Stay','service','In-room tech, guest messaging, on-property apps, real-time requests.'],\n         ['Depart','checkout','Folio settlement, mobile checkout, late-checkout offers.'],\n         ['Retention','loyalty & return','Post-stay feedback, loyalty, segmentation, win-back campaigns.']]\n  };\n\n  CAPS = {\n    hu: [['01','Revenue management','árazás, kereslet, kihasználtság'],['02','Digitális marketing','kampányok, tartalom, csatornák'],['03','Hirdetéstechnológia','Google & Meta, mérés, attribúció'],['04','Értékesítés','direkt foglalás, konverzió'],['05','Üzleti intelligencia','adat, riport, döntés'],['06','Szállodai webfejlesztés','konverzióvezérelt oldalak']],\n    en: [['01','Revenue management','pricing, demand, occupancy'],['02','Digital marketing','campaigns, content, channels'],['03','Ad technology','Google & Meta, measurement, attribution'],['04','Sales','direct booking, conversion'],['05','Business intelligence','data, reporting, decisions'],['06','Hotel web development','conversion-driven sites']]\n  };\n\n  SPINE = {\n    hu: [['Felfedezés',[['Direct','direkt csatorna']]],\n         ['Foglalás',[['Booking Engine','a mag'],['Voucher','utalvány']]],\n         ['Érkezés előtt',[['Inbox','vendégüzenetek']]],\n         ['Megérkezés',[['@soon','']]],\n         ['Tartózkodás',[['GuestApp','helyszíni app']]],\n         ['Elutazás',[['@soon','']]],\n         ['Visszatérés',[['Loyalty','visszatérés'],['@soon','']]]],\n    en: [['Discover',[['Direct','direct channel']]],\n         ['Book',[['Booking Engine','the core'],['Voucher','vouchers']]],\n         ['Pre-arrival',[['Inbox','guest messaging']]],\n         ['Arrive',[['@soon','']]],\n         ['Stay',[['GuestApp','on-property app']]],\n         ['Depart',[['@soon','']]],\n         ['Retention',[['Loyalty','return'],['@soon','']]]]\n  };\n\n  LOOP = {\n    hu: [['Hirdetés','kereslet'],['Weboldal','saját felület'],['Foglalás','direkt'],['Érkezés előtt','ráhangolódás'],['Helyszín','vendégélmény'],['Utókövetés','visszatérés']],\n    en: [['Ad','demand'],['Website','own surface'],['Book','direct'],['Pre-arrival','anticipation'],['On-site','experience'],['Follow-up','return']]\n  };\n\n  LOOPCAP = {\n    hu: [['Zárt kör','A hirdetéstől a visszatérő vendégig minden szakasz ugyanabban a rendszerben fut.'],['Minden kör adatot termel','Roomlytics — a mérési réteg, ami összeköti a stacket a service réteggel.'],['A visszatérő a legolcsóbb','Alacsonyabb akvizíciós költség — a service réteg dönti el, hol és mennyiért hirdetünk.']],\n    en: [['A closed loop','From the ad to the returning guest, every stage runs in the same system.'],['Every loop produces data','Roomlytics — the measurement layer wiring the stack to the service layer.'],['The return is cheapest','Lower acquisition cost — the service layer decides where and how much we spend.']]\n  };\n\n  TOPICS = {\n    hu: ['Direkt foglalás és OTA — a kettő egyensúlya','Guest journey automatizálás','Szállodai revenue management és árazás','Digitális hirdetés hatékonysága','A szállodai szoftverpiac Közép-Európában','AI és a szállodai kereslet','Szoftver és szolgáltatás egy modellben'],\n    en: ['Direct booking and OTAs — the balance between them','Guest-journey automation','Hotel revenue management & pricing','Digital advertising that performs','The hotel software market in CEE','AI and hotel demand','Software and service in one model']\n  };\n\n  NAV = {\n    hu: [['#thesis','tézis'],['#morgens','MORGENS'],['#roomsome','RoomSome'],['#mentio','Mentio'],['#contact','kapcsolat']],\n    en: [['#thesis','thesis'],['#morgens','MORGENS'],['#roomsome','RoomSome'],['#mentio','Mentio'],['#contact','contact']]\n  };\n\n  orbit(t) {\n    const active = ['Loyalty', 'Voucher', 'Direct', 'GuestApp', 'Inbox', 'Roomlytics'];\n    const all = active.map(m => ({ name: m, soon: false })).concat([0, 1, 2].map(() => ({ name: t.soon, soon: true })));\n    const n = all.length, small = this.state.w < 640;\n    const rx = small ? 29 : 44, ry = small ? 36 : 42;\n    return all.map((o, i) => {\n      const a = (-90 + i * (360 / n)) * Math.PI / 180;\n      return { name: o.name, soon: o.soon, left: +(50 + rx * Math.cos(a)).toFixed(2), top: +(50 + ry * Math.sin(a)).toFixed(2) };\n    });\n  }\n\n  renderVals() {\n    const L = this.state.lang, t = this.T[L], act = this.state.active;\n    const teal = '#14b8a6', w = this.state.w;\n    const cols = (n, mid, small) => 'repeat(' + (w >= 768 ? n : w >= 640 ? mid : small) + ',minmax(0,1fr))';\n    return {\n      t,\n      imgRef: this.imgRef,\n      navDisplay: this.state.narrow ? 'none' : 'flex',\n      fanDisplay: w >= 768 ? 'block' : 'none',\n      nodeCols: cols(7, 4, 2),\n      spineCols: cols(7, 4, 2),\n      loopCols: cols(6, 3, 2),\n      threeCols: cols(3, 3, 1),\n      twoCols: cols(2, 2, 1),\n      capCols: cols(2, 2, 1),\n      splitCols: w >= 900 ? '5fr 7fr' : '1fr',\n      setHu: () => this.setState({ lang: 'hu' }),\n      setEn: () => this.setState({ lang: 'en' }),\n      huBg: L === 'hu' ? teal : 'transparent',\n      huFg: L === 'hu' ? '#04211d' : 'rgba(242,242,240,.65)',\n      enBg: L === 'en' ? teal : 'transparent',\n      enFg: L === 'en' ? '#04211d' : 'rgba(242,242,240,.65)',\n      detail: act !== null ? this.PHASES[L][act][2] : t.idle,\n      detailColor: act !== null ? 'rgba(244,244,245,.65)' : 'rgba(244,244,245,.45)',\n      detailGt: act !== null ? teal : 'rgba(20,184,166,.4)',\n      nav: this.NAV[L].map(n => ({ href: n[0], label: n[1] })),\n      phases: this.PHASES[L].map((p, i) => ({\n        num: '0' + (i + 1), name: p[0], tag: p[1],\n        border: act === i ? 'rgba(20,184,166,.6)' : 'rgba(244,244,245,.10)',\n        bg: act === i ? 'rgba(20,184,166,.06)' : 'rgba(244,244,245,.025)',\n        on: () => this.setState({ active: i }),\n        off: () => this.setState({ active: null })\n      })),\n      caps: this.CAPS[L].map(c => ({ k: c[0], v: c[1], d: c[2] })),\n      pillFont: w < 640 ? '10px' : '11.5px',\n      pillPad: w < 640 ? '5px 8px' : '7px 12px',\n      coreW: w < 640 ? '112px' : '150px',\n      orbitMods: this.orbit(t).map(o => ({\n        name: o.name, left: o.left, top: o.top,\n        style: o.soon ? 'dashed' : 'solid',\n        border: o.soon ? 'rgba(242,242,240,.18)' : 'rgba(242,242,240,.22)',\n        bg: o.soon ? 'transparent' : 'rgba(18,19,22,.85)',\n        fg: o.soon ? 'rgba(242,242,240,.42)' : 'rgba(242,242,240,.78)'\n      })),\n      orbitLinks: this.orbit(t).map(o => ({\n        x: o.left, y: o.top,\n        stroke: o.soon ? 'rgba(242,242,240,.13)' : 'rgba(20,184,166,.3)'\n      })),\n      chips: ['Booking Engine', 'Loyalty', 'Voucher', 'Direct', 'GuestApp', 'Inbox', 'Roomlytics', '@soon'].map(n => {\n        const soon = n === '@soon', core = n === 'Booking Engine';\n        return {\n          name: soon ? t.soon : n,\n          style: soon ? 'dashed' : 'solid',\n          border: core ? '#14b8a6' : 'rgba(242,242,240,.2)',\n          bg: core ? 'rgba(20,184,166,.12)' : 'transparent',\n          fg: core ? '#5eead4' : soon ? 'rgba(242,242,240,.42)' : 'rgba(242,242,240,.7)',\n          weight: core ? 600 : 400\n        };\n      }),\n      spine: this.SPINE[L].map(s => ({\n        phase: s[0],\n        rule: s[1].some(m => m[0] !== '@soon') ? 'rgba(20,184,166,.4)' : 'rgba(242,242,240,.12)',\n        mods: s[1].map(m => {\n          const soon = m[0] === '@soon';\n          const core = m[0] === 'Booking Engine';\n          return {\n            name: soon ? t.soon : m[0],\n            role: soon ? '' : m[1],\n            style: soon ? 'dashed' : 'solid',\n            border: soon ? 'rgba(242,242,240,.16)' : core ? teal : 'rgba(242,242,240,.18)',\n            bg: core ? 'rgba(20,184,166,.16)' : soon ? 'transparent' : '#1e2429',\n            fg: core ? '#5eead4' : soon ? 'rgba(242,242,240,.4)' : 'rgba(242,242,240,.78)',\n            weight: core ? 700 : 500\n          };\n        })\n      })),\n      loopSteps: this.LOOP[L].map(s => ({ a: s[0], b: s[1] })),\n      loopCaps: this.LOOPCAP[L].map((c, i) => ({ n: '0' + (i + 1), a: c[0], b: c[1] })),\n      topics: this.TOPICS[L].map((x, i) => ({ n: '0' + (i + 1), txt: x }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
